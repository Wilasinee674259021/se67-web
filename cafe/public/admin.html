<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - Pink Cafe</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="hero">
    <h1>Admin Panel</h1>
    <nav>
      <a href="/">ลูกค้า</a>
      <button id="logoutBtn">ออกจากระบบ</button>
    </nav>
  </header>
  <main class="container">
    <section id="adminArea">
      <h2>จัดการสินค้า</h2>
      <form id="productForm">
        <input type="hidden" name="id" />
        <label>ชื่อ<br><input name="name" required></label>
        <label>รายละเอียด<br><textarea name="description"></textarea></label>
        <label>ราคา<br><input name="price" type="number" step="0.01"></label>
        <label>รูปภาพ<br><input name="image" type="file" accept="image/*"></label>
        <button type="submit">บันทึก</button>
      </form>
      <h3>รายการสินค้า</h3>
      <div id="productList"></div>
    </section>
  </main>
</body>
</html>
